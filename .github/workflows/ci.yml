name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Publication sur Cloudflare Pages depuis 1.2.0 (chantier B, D-004, D-013) : origine propre à l'app.
# L'ancienne adresse https://django184.github.io/guitar/ n'est plus publiée : elle garde la 1.1.0
# (qui sait exporter la bibliothèque) jusqu'au passeur (ECOSYSTEME.md §7.4, étape 3).
env:
  PROJET: pratique-guitare
  SITE: https://pratique-guitare.pages.dev/

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        # Nouvelle dépendance pas encore verrouillée : npm install (le job lockfile met le verrou à jour).
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install --no-audit --no-fund; else npm install; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build for Cloudflare Pages
        run: npm run build
        env:
          APP_VERSION: ${{ github.sha }}
          # Clé de l'API YouTube Data v3 (recherche de vidéos), restreinte au site publié :
          # variable du dépôt (Settings → Secrets and variables → Actions → Variables).
          VITE_YOUTUBE_API_KEY: ${{ vars.YOUTUBE_API_KEY }}

      - name: Check PWA output (manifest, service worker, precache)
        run: |
          test -f dist/sw.js || { echo "::error::dist/sw.js missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "::error::manifest missing"; exit 1; }
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('dist/manifest.webmanifest', 'utf8'));
            const sw = fs.readFileSync('dist/sw.js', 'utf8');
            const problems = [];
            if (m.display !== 'standalone') problems.push('display');
            if (!m.icons || m.icons.length < 3) problems.push('icons');
            if (!m.start_url || !m.scope) problems.push('start_url/scope');
            for (const file of ['index.html', 'font/Bravura.woff2', 'sons/generaluser-gs-2.0.3.sf3']) {
              if (!sw.includes(file)) problems.push(file + ' not precached');
            }
            const headers = fs.readFileSync('dist/_headers', 'utf8');
            const html = fs.readFileSync('dist/index.html', 'utf8');
            if (!/Content-Security-Policy: default-src 'self'.*frame-ancestors 'none'/.test(headers)) problems.push('_headers CSP');
            if (!html.includes('http-equiv=\"Content-Security-Policy\"')) problems.push('meta CSP');
            const v = JSON.parse(fs.readFileSync('dist/version.json', 'utf8'));
            if (v.commit !== process.env.GITHUB_SHA) problems.push('version.json');
            console.log('manifest:', m.name, '| id:', m.id, '| start_url:', m.start_url, '| scope:', m.scope, '| version:', v.version);
            if (problems.length) { console.error('::error::' + problems.join(', ')); process.exit(1); }
          "
          du -sh dist
          ls -la dist dist/assets

      - name: Keep the generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json

      - name: Keep the tested build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end (Chromium, ordinateur + mobile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        # Nouvelle dépendance pas encore verrouillée : npm install (le job lockfile met le verrou à jour).
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install --no-audit --no-fund; else npm install; fi

      - name: Build (base « / » for the local preview server)
        run: npm run build

      - name: Download Guitar Pro test files (alphaTab test suite, MPL-2.0)
        run: |
          mkdir -p e2e/fixtures/download
          base=https://raw.githubusercontent.com/CoderLine/alphaTab/v1.8.4/packages/alphatab/test-data
          for f in guitarpro3/effects.gp3 guitarpro5/canon.gp5 guitarpro6/chords.gpx guitarpro7/serenade.gp; do
            curl -sSfL "$base/$f" -o "e2e/fixtures/download/$(basename "$f")"
          done
          ls -la e2e/fixtures/download

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Summarize Playwright results
        if: ${{ !cancelled() }}
        run: node e2e/summary.mjs e2e-results.json

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            e2e-results.json
          retention-days: 14

  deploy:
    name: Publication Cloudflare Pages
    # Push sur main, ou relance à la main (Actions → CI → Run workflow) sur main.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-24.04
    outputs:
      publie: ${{ steps.deploy.outcome }}
      site: ${{ steps.projet.outputs.site }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets absents
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::Publication NON faite : secrets Cloudflare absents (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)."
          echo "## ⚠️ Publication non faite : secrets Cloudflare absents" >> "$GITHUB_STEP_SUMMARY"
      - name: Projet Cloudflare Pages (créé s'il n'existe pas, adresse relevée)
        id: projet
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          code=$(curl -sS -o projet.json -w '%{http_code}' -H "$auth" "$api/$PROJET")
          if [ "$code" = 404 ]; then
            echo "Projet $PROJET absent : création."
            code=$(curl -sS -o projet.json -w '%{http_code}' -X POST -H "$auth" -H 'Content-Type: application/json' \
              --data "{\"name\":\"$PROJET\",\"production_branch\":\"main\"}" "$api")
          fi
          if [ "$code" != 200 ]; then
            echo "::error::API Cloudflare ($code) : $(jq -c '.errors' projet.json)"; exit 1
          fi
          sous_domaine=$(jq -r '.result.subdomain' projet.json)
          branche=$(jq -r '.result.production_branch' projet.json)
          echo "Projet $PROJET : $sous_domaine (branche de production : $branche)"
          echo "site=https://$sous_domaine/" >> "$GITHUB_OUTPUT"
          if [ "https://$sous_domaine/" != "$SITE" ]; then
            # Cloudflare ajoute un suffixe quand le nom est pris : publication quand même, adresse à reporter
            # dans le proxy (DEFAULT_ORIGINS), le workflow et la fiche.
            echo "::warning title=Adresse::Cloudflare a attribué https://$sous_domaine/ au lieu de $SITE"
          fi
          if [ "$branche" != main ]; then
            echo "::error::Branche de production « $branche » au lieu de « main »."; exit 1
          fi
      - name: Build testé
        if: steps.projet.outcome == 'success'
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Publication sur Cloudflare Pages
        id: deploy
        if: steps.projet.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pratique-guitare --branch=main --commit-dirty=true
      - name: Résumé
        if: steps.deploy.outcome == 'success'
        run: echo "## ✅ Publiée sur ${{ steps.projet.outputs.site }} ($(jq -r '.version + "+" + .commit[0:7]' dist/version.json))" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test (site publié)
    needs: deploy
    if: needs.deploy.outputs.publie == 'success'
    runs-on: ubuntu-24.04
    env:
      E2E_BASE_URL: ${{ needs.deploy.outputs.site }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install --no-audit --no-fund; else npm install; fi

      - name: Wait until Cloudflare Pages serves this commit
        run: |
          for i in $(seq 1 48); do
            servi=$(curl -fsS "${E2E_BASE_URL}version.json?ci=${GITHUB_RUN_ID}-$i" 2>/dev/null || true)
            if echo "$servi" | grep -q "\"$GITHUB_SHA\""; then
              echo "Version $GITHUB_SHA en ligne sur $E2E_BASE_URL"; exit 0
            fi
            sleep 10
          done
          echo "::error::$E2E_BASE_URL ne sert pas $GITHUB_SHA après 8 minutes (servi : ${servi:-rien})"
          exit 1

      - name: HTTP headers of the live site
        run: |
          curl -fsSI "$E2E_BASE_URL" | tee entetes.txt
          problems=""
          grep -qi "^content-security-policy:.*frame-ancestors 'none'" entetes.txt || problems="$problems CSP"
          grep -qi "^x-content-type-options: nosniff" entetes.txt || problems="$problems nosniff"
          grep -qi "^referrer-policy:" entetes.txt || problems="$problems Referrer-Policy"
          grep -qi "^permissions-policy:.*microphone=(self)" entetes.txt || problems="$problems Permissions-Policy"
          curl -fsSI "${E2E_BASE_URL}sw.js" | grep -qi "^cache-control: no-cache" || problems="$problems sw.js-no-cache"
          if [ -n "$problems" ]; then echo "::error::En-têtes manquants :$problems"; exit 1; fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Phase 1 + offline + backup checks against the live site
        run: npx playwright test e2e/app.spec.ts

      - name: Summarize results
        if: ${{ !cancelled() }}
        run: node e2e/summary.mjs e2e-results.json

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: |
            playwright-report
            test-results
            e2e-results.json
          retention-days: 14

  statut:
    # Résultat lisible même quand le dépôt sera privé (D-011) : branche ci-statut, statut.json.
    needs: [check, e2e, deploy, smoke]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Écrire statut.json sur la branche ci-statut
        env:
          TESTS: ${{ needs.check.result == 'success' && needs.e2e.result == 'success' && 'success' || 'failure' }}
          PUBLICATION: ${{ needs.deploy.result }}
          PUBLIE: ${{ needs.deploy.outputs.publie }}
          EN_LIGNE: ${{ needs.smoke.result }}
          SITE_PUBLIE: ${{ needs.deploy.outputs.site }}
          TOKEN: ${{ github.token }}
        run: |
          mkdir statut && cd statut && git init -q -b ci-statut
          printf '{"commit":"%s","tests":"%s","publication":"%s","publie":"%s","en_ligne":"%s","site":"%s","date":"%s","run":"%s/%s/actions/runs/%s"}\n' \
            "$GITHUB_SHA" "$TESTS" "$PUBLICATION" "${PUBLIE:-skipped}" "${EN_LIGNE:-skipped}" "$SITE_PUBLIE" "$(date -u +%FT%TZ)" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > statut.json
          cat statut.json
          git add statut.json
          git -c user.name="CI" -c user.email="ci@users.noreply.github.com" commit -qm "CI ${GITHUB_SHA::7} : tests $TESTS, publication $PUBLICATION, en ligne ${EN_LIGNE:-skipped}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-statut

  lockfile:
    name: Lockfile (package-lock.json)
    # Branches de ce dépôt uniquement : le jeton n'a pas le droit d'écrire sur un fork.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Create or update package-lock.json on the branch
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Fichier de verrouillage des dépendances (package-lock.json)"
            git push origin "HEAD:$GITHUB_HEAD_REF"
            echo "::notice title=Lockfile::package-lock.json créé ou mis à jour sur $GITHUB_HEAD_REF"
          else
            echo "::notice title=Lockfile::package-lock.json déjà à jour"
          fi
